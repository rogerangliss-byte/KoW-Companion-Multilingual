name: Promote Multilingual v4.5.0 Live once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-v450-live-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy complete approved TEST7 build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/kow-test /tmp/kow-test.zip
          curl -L --fail --retry 3 -o /tmp/kow-test.zip https://github.com/rogerangliss-byte/KoW-Companion--Multilingual-Test/archive/48cead8118b0f1c6181df3a620c42a7b2a0ad377.zip
          mkdir -p /tmp/kow-test
          unzip -q /tmp/kow-test.zip -d /tmp/kow-test
          SRC="$(find /tmp/kow-test -mindepth 1 -maxdepth 1 -type d | head -n1)"
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='CNAME' "$SRC/" ./
          printf '%s\n' 'multilingual.firestorm-companion.uk' > CNAME

      - name: Convert TEST7 identity to v4.5.0 LIVE
        shell: python
        run: |
          from pathlib import Path
          import re

          root=Path('.')
          text_ext={'.html','.js','.json','.md','.txt','.csv','.webmanifest','.xml','.yml','.yaml'}
          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts or '.github' in p.parts or p.suffix.lower() not in text_ext:
                  continue
              try:
                  s=p.read_text(encoding='utf-8')
              except Exception:
                  continue
              s=s.replace('KoW Companion Multilingual v4.5.0 TEST','KoW Companion Multilingual v4.5.0')
              s=s.replace('v4.5.0 TEST','v4.5.0')
              s=s.replace('v=450-test7','v=450-live')
              s=s.replace('TEST BUILD — NOT LIVE.','LIVE BUILD.')
              s=s.replace('TEST BUILD — NOT LIVE','LIVE BUILD')
              s=s.replace(' — PAS EN PRODUCTION.',' — VERSION LIVE.')
              s=s.replace(' — NICHT LIVE.',' — LIVE-VERSION.')
              s=s.replace(' — NON LIVE.',' — VERSIONE LIVE.')
              s=s.replace('The red TEST / NOT LIVE banner remains visible.','The live build loads without a TEST / NOT LIVE banner.')
              s=s.replace('la bannière rouge TEST','l’absence de bannière TEST sur la version Live')
              s=s.replace('roten TEST-Banner','fehlenden TEST-Banner der Live-Version')
              s=s.replace('banner rosso TEST','assenza del banner TEST nella versione Live')
              p.write_text(s,encoding='utf-8')

          index=Path('index.html')
          s=index.read_text(encoding='utf-8')
          s=re.sub(r'\n?<div id="multilingualTestBanner"[^>]*>.*?</div>\n?','\n',s,count=1,flags=re.S)
          s=re.sub(r'\n?<script src="\./lang/clean-qa\.js\?v=450-live"></script>\n?','\n',s,count=1)
          s=s.replace("// v4.5.0 — native working-state persistence.","// v4.5.0 LIVE — native working-state persistence.")
          index.write_text(s,encoding='utf-8')

          sw=Path('service-worker.js')
          if sw.exists():
              z=sw.read_text(encoding='utf-8')
              z=re.sub(r"const CACHE='[^']+';","const CACHE='kow-multilingual-live-v4.5.0';",z,count=1)
              sw.write_text(z,encoding='utf-8')

          qa=Path('lang/clean-qa.js')
          if qa.exists(): qa.unlink()

      - name: Verify complete LIVE package
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f service-worker.js
          test -f officers.json
          test -f officers.csv
          test -d officer-portraits
          test -f lang/en.js
          test -f lang/fr.js
          test -f lang/de.js
          test -f lang/it-base-v4357.js
          test -f lang/v440-runtime-language-overrides.js
          test -f lang/v450-language-additions.js
          test -f lang/v450-full-help.js
          test -f lang/clean-i18n.js
          ! test -f lang/clean-qa.js
          grep -q '<title>KoW Companion Multilingual v4.5.0</title>' index.html
          ! grep -q 'multilingualTestBanner' index.html
          ! grep -q 'clean-qa.js' index.html
          grep -q 'v450-full-help.js?v=450-live' index.html
          grep -q 'v450-language-additions.js?v=450-live' index.html
          grep -q 'clean-i18n.js?v=450-live' index.html
          grep -q "kow-multilingual-live-v4.5.0" service-worker.js
          grep -q '^multilingual.firestorm-companion.uk$' CNAME
          grep -q "'Save Progress':'Salva progressi'" lang/v450-language-additions.js
          grep -q 'window.KOW_HELP_HTML_V450' lang/v450-full-help.js

      - name: Commit LIVE and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FireStorm Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/promote-v450-live-once.yml
          git add -A
          git commit -m 'KoW Companion Multilingual v4.5.0 LIVE'
          git pull --rebase origin main
          git push origin main
