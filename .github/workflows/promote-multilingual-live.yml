name: Promote Multilingual v4.4.0 Live

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-multilingual-live.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Multilingual Live
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout approved Multilingual Test
        uses: actions/checkout@v4
        with:
          repository: rogerangliss-byte/KoW-Companion--Multilingual-Test
          ref: main
          path: approved-test

      - name: Promote approved v4.4.0 application
        shell: bash
        run: |
          set -euo pipefail
          # Preserve this Live repository's CNAME and workflow configuration.
          cp approved-test/index.html ./index.html
          cp approved-test/manifest.json ./manifest.json
          cp approved-test/icon.svg ./icon.svg
          cp approved-test/background-portrait.jpg ./background-portrait.jpg
          cp approved-test/background-landscape.jpg ./background-landscape.jpg
          cp approved-test/officers.csv ./officers.csv
          cp approved-test/officers.json ./officers.json
          [ -f approved-test/officers-default.csv ] && cp approved-test/officers-default.csv ./officers-default.csv || true
          [ -f approved-test/officers-default.json ] && cp approved-test/officers-default.json ./officers-default.json || true
          rm -rf officer-portraits lang
          cp -a approved-test/officer-portraits ./officer-portraits
          cp -a approved-test/lang ./lang
          cp approved-test/USER-GUIDE.md ./USER-GUIDE.md
          cp approved-test/USER-GUIDE-fr.md ./USER-GUIDE-fr.md
          cp approved-test/USER-GUIDE-de.md ./USER-GUIDE-de.md
          cp approved-test/USER-GUIDE-it.md ./USER-GUIDE-it.md
          cp approved-test/CHANGELOG.md ./CHANGELOG.md
          cp approved-test/LICENSE ./LICENSE
          cp approved-test/service-worker.js ./service-worker.js
          rm -f lang/clean-qa.js lang/clean-language-qa.js LANGUAGE-QA-STATIC.json MULTILINGUAL-QA-v4.4.0.md RELEASE-v4.4.0-MULTILINGUAL-TEST.md
          rm -rf approved-test

      - name: Convert TEST build to LIVE
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<title>KoW Companion v4.4.0 TEST</title>','<title>KoW Companion v4.4.0</title>')
          s=s.replace('v4.4.0 TEST','v4.4.0 LIVE')
          import re
          s=re.sub(r'\s*<div id="multilingualTestBanner"[^>]*>.*?</div>\s*','\n',s,count=1,flags=re.S)
          s=re.sub(r'\s*<script src="\./lang/clean-qa\.js\?v=[^"]+"></script>','',s)
          p.write_text(s,encoding='utf-8')

          Path('RELEASE-v4.4.0-MULTILINGUAL-LIVE.md').write_text('''# KoW Companion v4.4.0 — Multilingual LIVE\n\nReleased after clean13 runtime browser QA passed with zero issues in French, German and Italian.\n\n## Languages\n- English\n- French\n- German\n- Italian\n\n## QA gate\n- French: PASS — 0 missing, 0 same-as-English, 0 rendered-English\n- German: PASS — 0 missing, 0 same-as-English, 0 rendered-English\n- Italian: PASS — 0 missing, 0 same-as-English, 0 rendered-English\n\nBrowser auto-translation should remain disabled when independently validating app translations.\n''',encoding='utf-8')

      - name: Verify LIVE package
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<title>KoW Companion v4.4.0</title>' index.html
          grep -q 'v4.4.0 LIVE' index.html
          ! grep -q 'multilingualTestBanner' index.html
          ! grep -q 'clean-qa.js' index.html
          test -f lang/clean-i18n.js
          test -f lang/v440-runtime-language-overrides.js
          test -f lang/fr.js
          test -f lang/de.js
          test -f lang/it-base-v4357.js
          test -f RELEASE-v4.4.0-MULTILINGUAL-LIVE.md
          test "$(cat CNAME)" = 'multilingual.firestorm-companion.uk'
          node --check lang/en.js
          node --check lang/fr.js
          node --check lang/de.js
          node --check lang/it-base-v4357.js
          node --check lang/v440-runtime-language-overrides.js
          node --check lang/clean-i18n.js
          echo 'Multilingual v4.4.0 LIVE package verified.'

      - name: Commit Multilingual LIVE
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FireStorm Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No live changes to commit.'
          else
            git commit -m 'Release multilingual v4.4.0 LIVE'
            git push origin main
          fi
